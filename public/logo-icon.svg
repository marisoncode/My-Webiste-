<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="majesticMGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="majesticJGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="majesticSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="majesticFlareGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letter J (Royal Azure to Indigo) -->
  <path
    d="M 68 22 L 80 22 L 80 62 C 80 78, 68 88, 52 88 L 42 88 C 56 86, 68 76, 68 62 Z"
    fill="url(#majesticJGrad)"
  />

  <!-- Letter M (Electric Cyan Geometric Silhouette) -->
  <path
    d="M 22 15 L 36 26 L 36 78 L 22 78 Z"
    fill="url(#majesticMGrad)"
  />
  <path
    d="M 36 26 L 52 50 L 70 15 L 70 32 L 52 64 L 36 40 Z"
    fill="url(#majesticMGrad)"
  />
  <path
    d="M 70 15 L 70 54 L 60 62 L 60 32 Z"
    fill="url(#majesticMGrad)"
  />

  <!-- Celestial Orbital Ring / Swoosh -->
  <path
    d="M 14 68 C 18 55, 38 68, 62 60 C 82 52, 98 34, 104 18 C 102 24, 88 48, 62 56 C 36 64, 20 54, 14 68 Z"
    fill="url(#majesticSwooshGrad)"
    filter="url(#majesticFlareGlow)"
  />

  <!-- Specular Light Flare at Top-Right -->
  <circle cx="104" cy="18" r="3.5" fill="#ffffff" filter="url(#majesticFlareGlow)" />
  <circle cx="104" cy="18" r="1.5" fill="#ffffff" />
  <path
    d="M 104 10 L 104 26 M 96 18 L 112 18"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linecap="round"
    filter="url(#majesticFlareGlow)"
  />
</svg>
